name: Report a FOC problem
description: Report a Filecoin Onchain Cloud problem so the FOC team can triage and route it.
title: "[Problem]: "
labels:
  - needs-triage
  - user-report
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us track FOC problems.

        This repository is public. Do not include secrets, private keys, access tokens, credentials, sensitive customer data, or security vulnerabilities. Redact logs and identifiers before posting. If this is a security issue, use the security reporting process instead.
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      description: Pick the closest match. If you are unsure, choose "Not sure / other".
      options:
        - Synapse SDK
        - Warm Storage / PDP
        - Storage provider interaction
        - Payments
        - Documentation / onboarding
        - FOC website or status page
        - Not sure / other
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Impact / urgency
      options:
        - Blocking production or mainnet use
        - Blocking testing or integration
        - Degraded behavior with workaround
        - Question or needs investigation
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Public contact
      description: Optional. Provide a GitHub username, Slack handle, or other contact only if it is safe to share publicly.
      placeholder: "@github-user or Slack handle"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version or environment
      description: Include Synapse SDK version, CLI version, network, browser, OS, or environment details if relevant.
      placeholder: "Example: synapse-sdk vX.Y.Z on mainnet"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem are you seeing?
      placeholder: "Briefly describe the problem."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps, commands, or API calls that reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: identifiers
    attributes:
      label: Relevant public identifiers
      description: Include pieceCID, provider IDs, job IDs, deal IDs, transaction CIDs, or addresses only if they are safe to share publicly.
      placeholder: "pieceCID, provider IDs, job/deal IDs, transaction CIDs, etc."
    validations:
      required: false
  - type: input
    id: slack_thread
    attributes:
      label: Slack thread link
      description: If this started in #fil-foc, link the Slack thread here if it is useful and appropriate to share.
      placeholder: "https://filecoinproject.slack.com/archives/..."
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs, screenshots, or extra context
      description: Paste only redacted logs or attach screenshots that do not contain secrets or sensitive data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: public_safety
    attributes:
      label: Public safety check
      options:
        - label: I have not included secrets, credentials, private keys, sensitive customer data, or security vulnerability details.
          required: true
